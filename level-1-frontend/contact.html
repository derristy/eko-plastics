        <a href="index.html" class="header__logo">Site name</a>

            <span></span>

<main>
    <div class="container contact">
        <div>
            <div class="contact__headline">
                <h1 class="title">Contact us</h1>
                <p class="subtitle">Subheading for description or instructions</p>
            </div>

            <form class="form" action="#" method="post">
                <div class="form__field">
                    <label class="form__label" for="first-name">First name</label>
                    <input class="form__control" type="text" id="first-name" name="first_name" placeholder="Jane">
                </div>

                <div class="form__field">
                    <label class="form__label" for="last-name">Last name</label>
                    <input class="form__control" type="text" id="last-name" name="last_name" placeholder="Smitherton">
                </div>

                <div class="form__field form__field--full">
                    <label class="form__label" for="email">Email address</label>
                    <input class="form__control" type="email" id="email" name="email" placeholder="email@janesfakedomain.net">
                </div>

                <div class="form__field form__field--full">
                    <label class="form__label" for="phone">Number</label>
                    <input class="form__control" type="tel" id="phone" name="phone" placeholder="+380-ХХ-ХХ-ХХ-ХХХ">
                </div>

                <div class="form__field form__field--full">
                    <label class="form__label" for="message">Your message</label>
                    <textarea class="form__control" id="message" name="message" placeholder="Enter your question or message"></textarea>
                </div>

                <div class="form__field--full">
                    <button class="button button--lg form__submit" type="submit">Submit</button>
                </div>
            </form>
        </div>

        <img src="assets/img/hero-contact.jpg" alt="" class="contact__image" width="508" height="657">
    </div>
</main>
